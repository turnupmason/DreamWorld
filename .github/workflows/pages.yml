# Publishes the web game (prototype/) to GitHub Pages on every push to master,
# so Mason can play the latest version in a phone browser:
#   https://turnupmason.github.io/DreamWorld/
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
# Can also be started by hand: Actions → "Publish web game" → Run workflow.
name: Publish web game

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype
      - id: deployment
        uses: actions/deploy-pages@v4
