# Builds the iPhone app (ios/) on a GitHub Mac every time the Swift side changes, so Swift errors show up
# without waiting for Mason's Mac. It only compiles for the simulator, with no signing: it can't run the app
# or install it on a phone (Mason still does that in Xcode).
# Results: GitHub → Actions → "Build iPhone app". Can also be started by hand there (Run workflow).
name: Build iPhone app

on:
  push:
    branches: [master]
    paths: ['ios/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for the simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild -project ios/MirrorTown.xcodeproj -target MirrorTown -configuration Debug \
            -sdk iphonesimulator ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
