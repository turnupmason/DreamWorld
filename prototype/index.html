<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f6f1e7">
  <!-- "Add to Home Screen" on iPhone: opens full screen like an app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="镜像小镇">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <title>镜像小镇 · Mirror Town prototype</title>
  <link rel="stylesheet" href="fonts/fonts.css?v=240">
  <link rel="stylesheet" href="styles.css?v=240">
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="screen">
        <header class="hud" id="hud"></header>
        <main class="view">
          <canvas id="town"></canvas>
          <div class="ctxbar" id="ctxbar" hidden></div>
          <div class="live-banner" id="liveBanner" hidden></div>
          <div class="fab" id="fab" hidden></div>
          <button class="harvest-all" id="harvestAll" data-act="harvestAll" hidden></button>
          <div class="tip" id="tip" hidden></div>
          <div class="tray" id="tray" hidden></div>
          <section class="panel" id="panel" hidden></section>
        </main>
        <nav class="tabbar" id="tabbar"></nav>
        <div class="snack" id="snack" hidden></div>
        <div class="toasts" id="toasts"></div>
        <div class="sheet-backdrop" id="backdrop" hidden></div>
        <div class="sheet" id="sheet" hidden></div>
        <div class="coach" id="coach" hidden><div class="coach-ring"></div><div class="coach-hand">👆</div><div class="coach-bubble"></div></div>
        <div class="onboard" id="onboard" hidden></div>
      </div>
    </div>
    <aside class="console" id="console"></aside>
  </div>
  <button class="console-toggle" data-act="consoleToggle" aria-label="Prototype console">🛠</button>

  <script src="js/i18n.js?v=240"></script>
  <script src="js/data.js?v=240"></script>
  <script src="js/state.js?v=240"></script>
  <script src="js/gfx.js?v=240"></script>
  <script src="js/audio.js?v=240"></script>
  <script src="js/sprites.js?v=240"></script>
  <script src="js/build.js?v=240"></script>
  <script src="js/scene.js?v=240"></script>
  <script src="js/games.js?v=240"></script>
  <script src="js/app.js?v=240"></script>
</body>
</html>
